<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name=viewport content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Amphitros 1953</title>
    <link rel="stylesheet" href="../node_modules/ol/ol.css">
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .svg-layer {
        position: absolute;
      }
      .map {
        width: 100%;
        height: 100%;
      }
      #map {
        background: white;
      }
      form {
        position: absolute;
        top: -2px;
        right: -2px;
        margin-left: 4em;
        text-align: left;
      }
      label {
        cursor: pointer;
        line-height: 2em;
        display: inline-block;
        padding-right: 0.5em;
      }
      footer {
        position: absolute;
        bottom: -2px;
        right: -2px;
        transition: opacity 500ms linear;
      }
      select, input, label, footer, button {
        font-size: 1.25rem;
        font-family: -Apple-System, sans-serif;
      }
      form, footer {
        background: #fff;
        border: 2px solid #000;
        color: #000;
        font-size: 1rem;
        padding: 0.25rem 0.5rem;
      }
      footer a {
        text-decoration: none;
        color: #0cb6f7;
      }
      #menu {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #menu input {
      }
      #menu > li > label {
        border-top: 1px solid rgba(255,255,255,0.5);
        display: block;
      }
      #menu > li:first-child > label {
        border-top: none;
      }
      #menu {
        display: none;
      }
      #menu.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="map" class="map"></div>
    <form>
      <select id="layer" tabindex="1">
      </select>
    </form>
    <footer>map by <a href="https://twitter.com/GarethDennis">Gareth Dennis</a>
      • viewer by <a href="https://twitter.com/blob8108">blobby tables</a>
      • source on <a href="https://github.com/tjvr/anengineerplays-archipelago-map">GitHub</a></footer>

    <!-- TODO: make a custom build of openlayers with only the packages we need -->

    <script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css">
    -->
    <script src="map.js" type="module"></script>
  </body>
</html>
